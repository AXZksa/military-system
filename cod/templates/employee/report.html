{% extends "base.html" %}
{% block title %}بلاغ عاجل{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle ms-2"></i>بلاغ عاجل</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">تفاصيل البلاغ</label>
                        <textarea name="report_text" class="form-control" rows="6" required placeholder="اكتب تفاصيل البلاغ هنا..."></textarea>
                    </div>
                    <div class="alert alert-warning">
                        <i class="bi bi-info-circle"></i> سيتم رفع البلاغ مباشرة للقيادة.
                    </div>
                    <button class="btn btn-danger w-100 btn-lg">إرسال البلاغ</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
