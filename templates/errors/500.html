{% extends "base.html" %}
{% block title %}خطأ في الخادم{% endblock %}
{% block content %}
<div class="text-center py-5" style="animation: pageEnter .4s cubic-bezier(.16,1,.3,1);">
    <div class="display-1 fw-bold" style="color:var(--accent-red);font-size:6rem;line-height:1;text-shadow:0 0 40px var(--accent-red-dim);">500</div>
    <div class="mb-3"><i class="bi bi-gear" style="font-size:3rem;color:var(--accent-red);animation: spin 2s linear infinite;"></i></div>
    <h4 class="fw-bold mb-2">خطأ في الخادم</h4>
    <p class="text-muted mb-4" style="max-width:400px;margin:0 auto 20px;">حدث عطل فني. الفريق الهندسي اشتغل على الموضوع. حاول مرة ثانية بعد شوي.</p>
    <a href="{{ url_for('index') }}" class="btn btn-success rounded-pill px-4">
        <i class="bi bi-house ms-1"></i> العودة للرئيسية
    </a>
</div>
{% endblock %}
