<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" style="background:#0a1a12;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>403 — غير مصرح</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Tajawal',sans-serif;background:#0a1a12;color:#f0ede8;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
        .error-box{border:1px solid #2a4a34;padding:40px;max-width:400px;width:100%;}
        .error-box .emblem{width:60px;height:60px;background:#b91c1c;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;border:2px solid #c8a454;}
        .error-box .emblem i{font-size:28px;color:#c8a454;}
        .error-box h1{font-size:3rem;font-weight:800;color:#b91c1c;margin-bottom:4px;}
        .error-box p{color:#c4bcae;margin-bottom:24px;font-size:14px;}
        .error-box a{display:inline-block;padding:10px 28px;background:#006c35;color:#fff;text-decoration:none;font-weight:600;font-size:14px;}
        .error-box a:hover{background:#008847;}
        .error-box .footer{color:#8a806e;font-size:11px;margin-top:24px;padding-top:14px;border-top:1px solid #2a4a34;}
    </style>
</head>
<body>
    <div class="error-box">
        <div class="emblem"><i class="bi bi-shield-fill-check"></i></div>
        <h1>403</h1>
        <p>ليس لديك صلاحية الوصول إلى هذه الصفحة.</p>
        <a href="/">العودة إلى الرئيسية</a>
        <div class="footer">المنظومة الحكومية لتوثيق الحركة</div>
    </div>
</body>
</html>
