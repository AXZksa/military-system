{% extends "base.html" %}
{% block title %}الصفحة غير موجودة{% endblock %}
{% block content %}
<div class="text-center py-5" style="animation: pageEnter .4s cubic-bezier(.16,1,.3,1);">
    <div class="display-1 fw-bold" style="color:var(--text-muted);font-size:6rem;line-height:1;text-shadow:0 0 40px var(--green-dim);">404</div>
    <div class="mb-3"><i class="bi bi-compass" style="font-size:3rem;color:var(--green-primary);"></i></div>
    <h4 class="fw-bold mb-2">الصفحة غير موجودة</h4>
    <p class="text-muted mb-4" style="max-width:400px;margin:0 auto 20px;">المسار اللي تدور عليه ما موجود. تأكد من الرابط أو ارجع للرئيسية.</p>
    <a href="{{ url_for('index') }}" class="btn btn-success rounded-pill px-4">
        <i class="bi bi-house ms-1"></i> العودة للرئيسية
    </a>
</div>
{% endblock %}
