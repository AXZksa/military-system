{% extends "base.html" %}
{% block title %}بلاغ عاجل{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-exclamation-circle ms-2"></i>بلاغ عاجل</h4>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-danger border-2">
            <div class="card-header fw-bold" style="background:rgba(220,38,38,.08);color:#DC2626;">
                <i class="bi bi-exclamation-triangle ms-2"></i>نموذج بلاغ عاجل
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">تفاصيل البلاغ</label>
                        <textarea name="report_text" class="form-control" rows="6" required placeholder="اكتب تفاصيل البلاغ هنا..."></textarea>
                    </div>
                    <div class="alert alert-warning d-flex align-items-center gap-2 py-2">
                        <i class="bi bi-info-circle"></i>
                        <span>سيتم رفع البلاغ مباشرة للقيادة للمعالجة.</span>
                    </div>
                    <button class="btn btn-danger w-100 py-2 fw-bold"><i class="bi bi-send ms-1"></i> إرسال البلاغ</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
