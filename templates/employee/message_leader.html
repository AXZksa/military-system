{% extends "base.html" %}
{% block title %}راسل القائد{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-chat ms-2"></i>راسل القائد</h5></div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">رسالتك</label>
                        <textarea name="message" class="form-control" rows="5" required placeholder="اكتب رسالتك للقيادة..."></textarea>
                    </div>
                    <button class="btn btn-primary w-100">إرسال</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
