{% extends "base.html" %}
{% block title %}الإشعارات{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-bell ms-2"></i>الإشعارات</h5></div>
    <div class="card-body p-0">
        {% if notifications %}
        <div class="list-group list-group-flush">
            {% for nid, content, cat, is_read in notifications %}
            <div class="list-group-item {% if not is_read %}list-group-item-warning{% endif %}">
                <small class="text-muted">{{ cat }}</small>
                <p class="mb-0">{{ content }}</p>
            </div>
            {% endfor %}
        </div>
        {% else %}<p class="text-muted p-3 mb-0">لا توجد إشعارات.</p>{% endif %}
    </div>
</div>
{% endblock %}
