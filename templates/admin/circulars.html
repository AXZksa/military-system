{% extends "base.html" %}
{% block title %}التعاميم{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-6 mb-4">
        <div class="card h-100">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-megaphone ms-2"></i>التعميم الحالي</h5></div>
            <div class="card-body">
                {% if circular %}
                <div class="border-start border-4 border-primary pe-3">
                    <p class="mb-1">{{ circular[0] }}</p>
                    <small class="text-muted">صدر: {{ circular[1] }}</small>
                </div>
                {% else %}
                <p class="text-muted mb-0">لا يوجد تعميم حالياً.</p>
                {% endif %}
            </div>
        </div>
    </div>
    <div class="col-lg-6 mb-4">
        <div class="card h-100">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil ms-2"></i>إضافة تعميم</h5></div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin_set_circular') }}">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <textarea name="content" class="form-control" rows="4" required placeholder="نص التعميم..."></textarea>
                    </div>
                    <button class="btn btn-primary w-100 mb-2">حفظ التعميم</button>
                </form>
                <hr>
                <form method="POST" action="{{ url_for('admin_broadcast') }}">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <textarea name="content" class="form-control" rows="4" required placeholder="نص التعميم للبث..."></textarea>
                    </div>
                    <button class="btn btn-warning w-100">بث التعميم للجميع</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
