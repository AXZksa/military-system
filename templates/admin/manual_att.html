{% extends "base.html" %}
{% block title %}حضور/غياب يدوي{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-pencil-square ms-2"></i>تسجيل حضور وانصراف يدوي</h4>

<div class="row g-3">
    {% for sid, nm, _, _, rank, phone in soldiers %}
    <div class="col-md-4 col-sm-6">
        <div class="card h-100">
            <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <span class="fw-semibold">{{ rank ~ ' / ' if rank }}{{ nm }}</span>
                </div>
                <div class="d-flex gap-1">
                    <form method="POST" class="d-inline">
                        <input type="hidden" name="user_id" value="{{ sid }}">
                        <input type="hidden" name="action" value="check_in">
                        <input type="hidden" name="note" value="">
                        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                        <button class="btn btn-success btn-sm rounded-pill"><i class="bi bi-box-arrow-in-right"></i></button>
                    </form>
                    <form method="POST" class="d-inline">
                        <input type="hidden" name="user_id" value="{{ sid }}">
                        <input type="hidden" name="action" value="check_out">
                        <input type="hidden" name="note" value="">
                        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                        <button class="btn btn-danger btn-sm rounded-pill"><i class="bi bi-box-arrow-left"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
