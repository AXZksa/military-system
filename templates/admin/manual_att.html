{% extends "base.html" %}
{% block title %}حضور/غياب يدوي{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil-square ms-2"></i>تسجيل حضور/انصراف يدوي</h5></div>
    <div class="card-body">
        {% for sid, nm, _, _, rank, phone in soldiers %}
        <div class="card mb-2">
            <div class="card-body d-flex justify-content-between align-items-center py-2">
                <span>{{ rank ~ ' / ' if rank }}{{ nm }}</span>
                <div>
                    <form method="POST" class="d-inline">
                        <input type="hidden" name="user_id" value="{{ sid }}">
                        <input type="hidden" name="action" value="check_in">
                        <input type="hidden" name="note" value="تسجيل يدوي">
                        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                        <button class="btn btn-success btn-sm"><i class="bi bi-check-lg"></i> حضور</button>
                    </form>
                    <form method="POST" class="d-inline">
                        <input type="hidden" name="user_id" value="{{ sid }}">
                        <input type="hidden" name="action" value="check_out">
                        <input type="hidden" name="note" value="تسجيل يدوي">
                        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                        <button class="btn btn-danger btn-sm"><i class="bi bi-x-lg"></i> انصراف</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
