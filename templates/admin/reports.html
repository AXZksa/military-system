{% extends "base.html" %}
{% block title %}التقارير{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4"><i class="bi bi-file-text ms-2"></i>التقارير</h4>

<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-calendar ms-2"></i>تقرير اليوم: {{ dt }}</span>
        <span class="badge bg-dark rounded-pill px-3 py-2"><i class="bi bi-clock ms-1"></i>{{ now }}</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr><th>الاسم</th><th>دخول</th><th>خروج</th><th>الحالة</th></tr>
                </thead>
                <tbody>{{ rpt.body|safe }}</tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><span><i class="bi bi-archive ms-2"></i>التقارير المؤرشفة</span></div>
    <div class="card-body">
        <div class="row g-2">
            {% for d in dates %}
            <div class="col-4 col-md-2">
                <a href="{{ url_for('admin_report_date', date_str=d) }}" class="btn btn-outline-secondary w-100 rounded-pill">{{ d }}</a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
