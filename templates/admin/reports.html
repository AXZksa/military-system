{% extends "base.html" %}
{% block title %}التقارير{% endblock %}
{% block content %}
<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-file-text ms-2"></i>تقرير اليوم: {{ dt }}</h5>
        <span class="badge bg-secondary">الوقت: {{ now }}</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr><th>الاسم</th><th>دخول</th><th>خروج</th><th>الحالة</th></tr>
                </thead>
                <tbody>{{ rpt.body|safe }}</tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-archive ms-2"></i>التقارير المؤرشفة</h5></div>
    <div class="card-body">
        <div class="row">
            {% for d in dates %}
            <div class="col-md-3 col-6 mb-2">
                <a href="{{ url_for('admin_report_date', date_str=d) }}" class="btn btn-outline-secondary w-100">{{ d }}</a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
