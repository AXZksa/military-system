{% extends "base.html" %}
{% block title %}البلاغات{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="bi bi-exclamation-triangle ms-2"></i>البلاغات المفتوحة</h5></div>
    <div class="card-body">
        {% if reports %}
        {% for r in reports %}
        <div class="alert alert-warning">
            <div class="d-flex justify-content-between">
                <strong>{{ r.sender }}</strong>
                <small class="text-muted">{{ r.date }}</small>
            </div>
            <p class="mb-2 mt-1">{{ r.text }}</p>
            <form method="POST" action="{{ url_for('admin_reply_report', rid=r.id) }}" class="d-flex gap-2">
                <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                <input type="text" name="reply" class="form-control" placeholder="الرد..." required>
                <button class="btn btn-primary btn-sm">إرسال الرد</button>
            </form>
        </div>
        {% endfor %}
        {% else %}<p class="text-muted mb-0">✅ لا توجد بلاغات مفتوحة.</p>{% endif %}
    </div>
</div>
{% endblock %}
