{% extends "base.html" %}
{% block title %}الملف الشخصي{% endblock %}
{% block content %}
<div class="page-header">
    <h4 class="fw-bold mb-0"><i class="bi bi-person-circle ms-2" style="color:var(--gov-gold);"></i>الملف الشخصي</h4>
</div>
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header">الملف الشخصي</div>
            <div class="card-body text-center">
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        {% if user.avatar %}
                        <img src="{{ user.avatar }}" alt="الصورة الشخصية" id="avatarPreview" style="width:110px;height:110px;object-fit:cover;border:2px solid var(--gov-gold);">
                        {% else %}
                        <div id="avatarPlaceholder" style="width:110px;height:110px;background:var(--gov-green);display:flex;align-items:center;justify-content:center;margin:0 auto;border:2px solid var(--gov-gold);">
                            <i class="bi bi-person fs-1" style="color:#fff;"></i>
                        </div>
                        {% endif %}
                    </div>
                    <h5 class="fw-bold mb-1">{{ user.full_name }}</h5>
                    <small class="text-muted d-block mb-4">{{ 'قائد المنظومة' if user.role == 'admin' else user.rank_title or 'عسكري' }}</small>
                    <div class="mb-3">
                        <label class="form-label w-100">اختر صورة</label>
                        <input type="file" name="avatar" accept="image/png,image/jpeg,image/gif,image/webp" class="form-control" onchange="previewAvatar(event)">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius:0;"><i class="bi bi-upload ms-1"></i> رفع الصورة</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function previewAvatar(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        const img = document.getElementById('avatarPreview') || document.createElement('img');
        if (!img.id) {
            img.id = 'avatarPreview';
            img.style.cssText = 'width:110px;height:110px;object-fit:cover;border:2px solid var(--gov-gold);';
            const placeholder = document.getElementById('avatarPlaceholder');
            if (placeholder) placeholder.replaceWith(img);
            else document.querySelector('.mb-4').appendChild(img);
        }
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
}
</script>
{% endblock %}
