<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحقق من الصلاحيات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f14;
            --bg-secondary: #141a21;
            --accent-green: #22c55e;
            --accent-green-dim: rgba(34,197,94,.12);
            --text-primary: #e8edf2;
            --text-secondary: #b0b8c4;
            --text-muted: #7a8494;
            --motion-ease: cubic-bezier(.16,1,.3,1);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .loading-container {
            text-align: center;
            padding: 40px;
            animation: fadeIn 400ms var(--motion-ease);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-icon {
            width: 80px; height: 80px;
            background: var(--accent-green-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border: 2px solid var(--accent-green);
        }
        .loading-icon i {
            font-size: 32px;
            color: var(--accent-green);
        }
        .loading-title {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .loading-subtitle {
            color: var(--text-secondary);
            font-size: .85rem;
            margin-bottom: 24px;
        }
        .loading-steps {
            max-width: 300px;
            margin: 0 auto;
            text-align: right;
        }
        .loading-step {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: var(--text-muted);
            font-size: .8rem;
            transition: all 300ms var(--motion-ease);
        }
        .loading-step.active { color: var(--text-primary); }
        .loading-step.done { color: var(--accent-green); }
        .loading-step .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 300ms var(--motion-ease);
        }
        .loading-step.active .step-dot {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green-dim);
            animation: pulse 1s ease-in-out infinite;
        }
        .loading-step.done .step-dot { background: var(--accent-green); }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }
        .loading-footer {
            margin-top: 28px;
            color: var(--text-muted);
            font-size: .7rem;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-icon">
            <i class="bi bi-shield-fill-check"></i>
        </div>
        <div class="loading-title">جاري التحقق من الصلاحيات</div>
        <div class="loading-subtitle">منظومة توثيق الحركة الميدانية</div>
        <div class="loading-steps" id="steps">
            <div class="loading-step active" id="step1">
                <span class="step-dot"></span>
                <span>جاري التحقق من الصلاحيات</span>
            </div>
            <div class="loading-step" id="step2">
                <span class="step-dot"></span>
                <span>تحميل بيانات النظام</span>
            </div>
            <div class="loading-step" id="step3">
                <span class="step-dot"></span>
                <span>تهيئة مساحة العمل</span>
            </div>
        </div>
        <div class="loading-footer">قسم المعلومات — سلاح النقل</div>
    </div>
    <script>
    (function() {
        var step1 = document.getElementById('step1');
        var step2 = document.getElementById('step2');
        var step3 = document.getElementById('step3');
        var steps = [step1, step2, step3];
        var i = 0;
        function next() {
            if (i > 0) steps[i-1].classList.remove('active');
            if (i > 0) steps[i-1].classList.add('done');
            if (i < steps.length) {
                steps[i].classList.add('active');
                i++;
                setTimeout(next, 350);
            } else {
                window.location.href = '{{ redirect_url }}';
            }
        }
        setTimeout(next, 400);
    })();
    </script>
</body>
</html>
