{% extends "base.html" %}
{% block full_content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-shield-fill-check login-icon"></i>
            <h2 class="text-gold mt-3">منظومة توثيق الحركة الميدانية</h2>
            <p class="text-muted">تسجيل الدخول</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control form-control-lg" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-gold btn-lg w-100">دخول</button>
        </form>
        <div class="text-center mt-4">
            <small class="text-muted">⚠️ تنبيه أمني: هذه المنظومة مسجلة ومراقبة</small>
        </div>
    </div>
</div>
{% endblock %}
